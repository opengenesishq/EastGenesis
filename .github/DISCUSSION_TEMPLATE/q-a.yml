title: "[Question]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask about installation, provider setup, or a current EastGenesis workflow. For a reproducible product defect, use the Bug Report issue form instead. Never post API keys or tokens.

        可在这里询问安装、Provider 配置或当前 EastGenesis 工作流。可稳定复现的产品缺陷请改用 Bug Report Issue 表单。不要发布 API Key 或 Token。

  - type: input
    id: version
    attributes:
      label: Version and environment / 版本与环境
      placeholder: v0.1.7, macOS Intel x64
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do? / 你想完成什么？
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried? / 你尝试过什么？
      description: Include visible messages with secrets removed. / 可附上已移除敏感信息的可见提示。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Public-post check / 公开内容确认
      options:
        - label: I searched existing discussions and documentation. / 我已搜索现有 Discussion 和文档。
          required: true
        - label: I removed credentials, private data, and sensitive local paths. / 我已移除凭据、私有数据和敏感本机路径。
          required: true
