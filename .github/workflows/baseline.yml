name: CaoGen baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caogen-baseline-reports
          path: test-results/
